name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Lint ──────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Lint frontend
        run: npx eslint . --max-warnings 50

      - name: Check format
        run: npx prettier --check "src/**/*.{ts,tsx}" "*.config.{ts,js,mjs}"

      - name: Install backend deps
        run: cd server && npm ci

      - name: Lint backend
        run: cd server && npx eslint . --max-warnings 50

      - name: Check backend format
        run: cd server && npx prettier --check "**/*.{js,ts}" "!node_modules/**"

  # ── Typecheck ─────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: TypeScript check (frontend)
        run: npx tsc -p tsconfig.json --noEmit

      - name: Install backend deps
        run: cd server && npm ci

      - name: TypeScript check (backend)
        run: cd server && npm run typecheck

  # ── Test ──────────────────────────────────────────────────
  test:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend deps
        run: cd server && npm ci

      - name: Reset test database
        run: cd server && npm run test:reset

      - name: Start server
        run: |
          cd server && node index.js &
          sleep 3
          curl -s http://localhost:3001/api/health

      - name: Run E2E tests
        run: cd server && npm run test:e2e

  # ── Build ─────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Check bundle size budget
        run: node scripts/check-bundle-size.cjs

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ── Deploy ────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, build]
    # 四道门禁全绿、且仅 main 分支的 push 才部署（PR 不触发）
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: deploy
      cancel-in-progress: false
    environment: production
    steps:
      - uses: actions/checkout@v4

      # CI 已构建并上传，服务器不再重复构建：省去约 1.5 分钟与 vite build 的内存峰值
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Configure SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Compute release name
        id: rel
        run: echo "name=$(date +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Upload release
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          REL: ${{ steps.rel.outputs.name }}
        run: |
          TARGET="$DEPLOY_USER@$HOST"
          ssh "$TARGET" "mkdir -p /srv/labelhub/releases/$REL/server"
          rsync -az --delete dist/ "$TARGET:/srv/labelhub/releases/$REL/dist/"
          rsync -az --delete --exclude node_modules --exclude data \
            server/ "$TARGET:/srv/labelhub/releases/$REL/server/"
          rsync -az scripts/ "$TARGET:/srv/labelhub/releases/$REL/scripts/"
          rsync -az ecosystem.config.cjs "$TARGET:/srv/labelhub/releases/$REL/"
          # activate.sh 常驻 shared/：回滚时 current 可能已被切走，不能依赖它
          rsync -az scripts/activate.sh "$TARGET:/srv/labelhub/shared/activate.sh"

      # 切换 → 健康检查 → 失败自动回滚。脚本以非零码退出时本步骤即失败，
      # 因此 CD 显示绿色等价于线上真实可用。
      - name: Activate with health check and auto-rollback
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          REL: ${{ steps.rel.outputs.name }}
        run: ssh "$DEPLOY_USER@$HOST" "bash /srv/labelhub/shared/activate.sh '$REL'"
